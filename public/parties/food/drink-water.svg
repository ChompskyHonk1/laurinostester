<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Stainless steel pitcher and glass of water">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#636a74" />
      <stop offset="13%" stop-color="#c3cad3" />
      <stop offset="29%" stop-color="#f6f8fa" />
      <stop offset="45%" stop-color="#a7afba" />
      <stop offset="61%" stop-color="#eef2f6" />
      <stop offset="78%" stop-color="#88909a" />
      <stop offset="100%" stop-color="#545b64" />
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dceff7" />
      <stop offset="100%" stop-color="#8fc4da" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfe" />
      <stop offset="100%" stop-color="#9aa2ac" />
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.30)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
  </defs>

  <ellipse cx="104" cy="184" rx="74" ry="13" fill="url(#shadow)" />

  <!-- glass of the drink, left -->
  <g>
    <path d="M18 132 L52 132 L48 178 C47.4 182 44 184 40 184 L30 184 C26 184 22.6 182 22 178 Z" fill="rgba(232,242,247,0.35)" stroke="#c3ccd4" stroke-width="2.5" />
    <path d="M21.6 150 L48.4 150 L46 176 C45.5 180 43 182 40 182 L30 182 C27 182 24.5 180 24 176 Z" fill="url(#liquid)" />
    <ellipse cx="35" cy="132" rx="17" ry="4.6" fill="none" stroke="#c3ccd4" stroke-width="2.5" />
    <ellipse cx="35" cy="137" rx="12" ry="3" fill="rgba(255,255,255,0.28)" />
  </g>

  <!-- handle -->
  <path d="M140 78 C190 74 192 148 140 150" fill="none" stroke="url(#metal)" stroke-width="13" stroke-linecap="round" />
  <path d="M140 78 C190 74 192 148 140 150" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round" />

  <!-- body -->
  <path d="M72 58 L132 58 C140 58 144 66 143 76 L136 164 C135 175 128 181 118 181 L86 181 C76 181 69 175 68 164 L61 76 C60 66 64 58 72 58 Z" fill="url(#metal)" />

  <!-- spout -->
  <path d="M72 58 L42 46 C38 44 36 50 40 53 L68 66 Z" fill="url(#metal)" stroke="#8b939d" stroke-width="1" />

  <!-- coloured reflection of the drink on the upper metal -->
  <path d="M66 68 L138 68 L135 96 L67 96 Z" fill="#8fc4da" opacity="0.34" />

  <!-- liquid visible in the open top -->
  <ellipse cx="102" cy="60" rx="33" ry="11" fill="url(#liquid)" />
  <ellipse cx="102" cy="58" rx="25" ry="6.5" fill="rgba(255,255,255,0.22)" />

  <!-- rim -->
  <ellipse cx="102" cy="58" rx="36" ry="11.5" fill="none" stroke="url(#rim)" stroke-width="5.5" />

  <!-- metal reflections -->
  <path d="M80 72 C76 102 76 140 82 172" stroke="rgba(255,255,255,0.55)" stroke-width="7" fill="none" stroke-linecap="round" />
  <path d="M124 76 C128 106 128 140 122 170" stroke="rgba(0,0,0,0.12)" stroke-width="10" fill="none" stroke-linecap="round" />
  
  <g transform="translate(131,50)">
    <circle r="15" fill="#f6d33a" stroke="#e0b800" stroke-width="2" />
    <circle r="11" fill="#fdf3b0" />
    <g stroke="#f0c419" stroke-width="2">
      <line x1="0" y1="-11" x2="0" y2="11" />
      <line x1="-11" y1="0" x2="11" y2="0" />
      <line x1="-7.8" y1="-7.8" x2="7.8" y2="7.8" />
      <line x1="-7.8" y1="7.8" x2="7.8" y2="-7.8" />
    </g>
  </g>
</svg>
